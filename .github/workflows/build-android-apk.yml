name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-sms-collector/**"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    paths:
      - "android-sms-collector/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-sms-collector

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare ephemeral debug signing key
        run: |
          keytool -genkeypair -keystore app/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IVAC-SMS-Collector-debug
          path: android-sms-collector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
